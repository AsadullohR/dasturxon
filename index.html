<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bir Oylik Dasturxon</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Bir Oylik Dasturxon">
<meta property="og:description" content="Bir oylik o'zbek dasturxoni — 4 haftalik ovqat rejasi.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;500;600&display=swap">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light dark;
  --bg:             #F5F1E8;
  --surface:        #FDFAF3;
  --surface-2:      #EDE8DA;
  --border:         #D8CFC0;
  --border-faint:   #E8E2D3;
  --text:           #1C1710;
  --text-muted:     #6A5D47;
  --text-faint:     #A09080;
  --accent:         #1A4870;
  --accent-tint:    #EAF1F8;
  --accent-hover:   #143A5C;
  --special:        #B34010;
  --special-tint:   #FDF1EB;
  --special-border: #DFBFA8;
  --week-rule:      #1A4870;
  --btn-ghost-bg:   transparent;
  --btn-ghost-text: #6A5D47;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:             #131008;
    --surface:        #1B1812;
    --surface-2:      #232018;
    --border:         #2D2920;
    --border-faint:   #252018;
    --text:           #EDE8D8;
    --text-muted:     #8A7D65;
    --text-faint:     #534B3C;
    --accent:         #4E8EC8;
    --accent-tint:    #0C1E30;
    --accent-hover:   #3A7AB8;
    --special:        #C85C22;
    --special-tint:   #1E0D04;
    --special-border: #3C1E0C;
    --week-rule:      #4E8EC8;
    --btn-ghost-bg:   transparent;
    --btn-ghost-text: #8A7D65;
  }
}

:root[data-theme="dark"] {
  --bg:             #131008;
  --surface:        #1B1812;
  --surface-2:      #232018;
  --border:         #2D2920;
  --border-faint:   #252018;
  --text:           #EDE8D8;
  --text-muted:     #8A7D65;
  --text-faint:     #534B3C;
  --accent:         #4E8EC8;
  --accent-tint:    #0C1E30;
  --accent-hover:   #3A7AB8;
  --special:        #C85C22;
  --special-tint:   #1E0D04;
  --special-border: #3C1E0C;
  --week-rule:      #4E8EC8;
  --btn-ghost-bg:   transparent;
  --btn-ghost-text: #8A7D65;
}

body {
  font-family: 'Source Sans 3', system-ui, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}

img { max-width: 100%; }
[hidden] { display: none !important; }

/* ── Header ── */
.page-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 2.25rem 2rem 1.75rem;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.header-left { flex: 1; min-width: 0; }

.eyebrow {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
}

.page-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(1.75rem, 4vw, 3rem);
  font-weight: 600;
  line-height: 1.05;
  color: var(--text);
  white-space: nowrap;
}

.page-title em {
  font-style: italic;
  color: var(--accent);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-shrink: 0;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.48rem 0.9rem;
  font-family: 'Source Sans 3', system-ui, sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.13s, color 0.13s, border-color 0.13s, opacity 0.13s;
  border: 1px solid transparent;
  line-height: 1;
  white-space: nowrap;
}

.btn svg { flex-shrink: 0; }

.btn-ghost {
  background: var(--btn-ghost-bg);
  color: var(--btn-ghost-text);
  border-color: var(--border);
}
.btn-ghost:hover {
  background: var(--accent-tint);
  color: var(--accent);
  border-color: var(--accent);
}

.btn-accent {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-special {
  background: var(--special);
  color: #fff;
  border-color: var(--special);
}
.btn-special:hover { opacity: 0.88; }

.btn-week {
  background: transparent;
  color: var(--text-faint);
  border-color: var(--border-faint);
  padding: 0.35rem 0.65rem;
  font-size: 0.72rem;
  margin-left: auto;
}
.btn-week:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-tint);
}

/* ── Main ── */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem 1.5rem 5rem;
}

/* ── Week block ── */
.week-block { margin-bottom: 2.5rem; }

.week-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding-bottom: 0.6rem;
  margin-bottom: 0.9rem;
  border-bottom: 2px solid var(--week-rule);
}

.week-label {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.55rem;
  font-weight: 600;
  color: var(--accent);
  line-height: 1;
}

.special-tag {
  font-size: 0.63rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--special);
  background: var(--special-tint);
  border: 1px solid var(--special-border);
  padding: 0.2rem 0.55rem;
  border-radius: 2px;
  white-space: nowrap;
}

/* ── Grid ── */
.grid-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 4px;
}

.days-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(128px, 1fr));
  min-width: 896px;
  background: var(--border);
  gap: 1px;
}

/* ── Day column ── */
.day-col {
  background: var(--surface);
  display: flex;
  flex-direction: column;
}

.day-col.is-special { background: var(--special-tint); }

.day-head {
  padding: 0.55rem 0.75rem 0.5rem;
  background: var(--surface-2);
  font-size: 0.67rem;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-faint);
}

.day-col.is-special .day-head {
  background: var(--special);
  color: rgba(255,255,255,0.93);
  border-bottom: none;
}

/* ── Meal slots ── */
.meal-slot {
  padding: 0.6rem 0.75rem;
  border-bottom: 1px solid var(--border-faint);
  flex: 1;
  min-height: 68px;
}

.day-col.is-special .meal-slot { border-bottom-color: var(--special-border); }
.meal-slot:last-child { border-bottom: none; }

.meal-type {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-faint);
  margin-bottom: 0.2rem;
}

.meal-name {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}

.meal-sub {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 0.12rem;
  line-height: 1.35;
}

/* ── Special feature ── */
.special-feature {
  padding: 0.8rem 0.75rem 0.9rem;
  flex: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 108px;
}

.special-kicker {
  font-size: 0.59rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--special);
  margin-bottom: 0.35rem;
}

.special-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--special);
  line-height: 1.15;
  text-wrap: balance;
}

.special-desc {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 0.4rem;
  line-height: 1.45;
}

/* ── Refresh animation ── */
@keyframes cellIn {
  from { opacity: 0; transform: translateY(-5px); }
  to   { opacity: 1; transform: translateY(0); }
}

.refreshing {
  animation: cellIn 0.28s ease both;
}

@media (prefers-reduced-motion: reduce) {
  .refreshing { animation: none; }
  .btn { transition: none; }
}

/* ── Legend strip ── */
.legend-strip {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0.75rem 2rem 0;
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.74rem;
  color: var(--text-muted);
}

.pip {
  width: 8px; height: 8px;
  border-radius: 1px;
  flex-shrink: 0;
}
.pip.regular { background: var(--accent); }
.pip.special  { background: var(--special); }

/* ── Footer ── */
.page-footer {
  text-align: center;
  padding: 1.75rem 1rem;
  border-top: 1px solid var(--border);
  font-size: 0.74rem;
  color: var(--text-faint);
  letter-spacing: 0.05em;
}

/* ── Print styles ── */
@media print {
  @page { size: A4 landscape; margin: 1.2cm; }

  :root {
    --bg:             #ffffff;
    --surface:        #ffffff;
    --surface-2:      #f0ece0;
    --border:         #c8c0b0;
    --border-faint:   #ddd8cc;
    --text:           #111111;
    --text-muted:     #4a4030;
    --text-faint:     #888070;
    --accent:         #1A4870;
    --accent-tint:    #EAF1F8;
    --special:        #B34010;
    --special-tint:   #fdf1eb;
    --special-border: #dfbfa8;
    --week-rule:      #1A4870;
  }

  .page-header { position: static; box-shadow: none; padding: 0 0 1rem; }
  .header-controls, .btn-week { display: none !important; }
  .eyebrow { margin-bottom: 0.25rem; }
  .page-title { font-size: 2rem; }
  .legend-strip { padding: 0.5rem 0 0; }
  .main { padding: 1.5rem 0 0; }

  .week-block {
    break-after: page;
    page-break-after: always;
    margin-bottom: 0;
  }
  .week-block:last-child {
    break-after: avoid;
    page-break-after: avoid;
  }

  .grid-wrap {
    overflow: visible;
    border-color: #c8c0b0;
  }

  .days-grid { min-width: unset; }

  .page-footer { display: none; }
}
</style>
</head>

// ── Data pools ──────────────────────────────────────────────────────────────

  ]},
];

// ── Helpers ──────────────────────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Render ───────────────────────────────────────────────────────────────────

function renderWeek(wi, animate) {
  const week  = weeks[wi];
  const grid  = document.getElementById('grid-' + wi);
  const stag  = document.getElementById('stag-' + wi);
  const sp    = SPECIALS[week.specialIdx];

  stag.textContent = '★ ' + sp.n;

  let html = '';

  week.days.forEach((day, di) => {
    html += `
      <div class="day-col">
        <div class="day-head">${DAYS[di]}</div>
        <div class="meal-slot${animate ? ' refreshing' : ''}">
          <div class="meal-type">Ertalab</div>
          <div class="meal-name">${day[0].n}</div>
          <div class="meal-sub">${day[0].s}</div>
        </div>
        <div class="meal-slot${animate ? ' refreshing' : ''}" style="${animate ? 'animation-delay:.04s' : ''}">
          <div class="meal-type">Tushlik</div>
          <div class="meal-name">${day[1].n}</div>
          <div class="meal-sub">${day[1].s}</div>
        </div>
        <div class="meal-slot${animate ? ' refreshing' : ''}" style="${animate ? 'animation-delay:.08s' : ''}">
          <div class="meal-type">Kechki</div>
          <div class="meal-name">${day[2].n}</div>
          <div class="meal-sub">${day[2].s}</div>
        </div>
      </div>`;
  });

  html += `
    <div class="day-col is-special">
      <div class="day-head">Yakshanba</div>
      <div class="meal-slot${animate ? ' refreshing' : ''}" style="${animate ? 'animation-delay:.12s' : ''}">
        <div class="meal-type">Ertalab</div>
        <div class="meal-name">${SUN_B.n}</div>
        <div class="meal-sub">${SUN_B.s}</div>
      </div>
      <div class="special-feature${animate ? ' refreshing' : ''}" style="${animate ? 'animation-delay:.16s' : ''}">
        <div class="special-kicker">Maxsus ovqat</div>
        <div class="special-title">${sp.n}</div>
        <div class="special-desc">${sp.d}</div>
      </div>
    </div>`;

  grid.innerHTML = html;
}

// ── Actions ──────────────────────────────────────────────────────────────────

function randomizeWeek(wi) {
  const bs = shuffle(B).slice(0, 6);
  const ls = shuffle(L).slice(0, 6);
  const ds = shuffle(D).slice(0, 6);
  weeks[wi].days = Array.from({length: 6}, (_, i) => [bs[i], ls[i], ds[i]]);
  renderWeek(wi, true);
}

function randomizeAll() {
  weeks.forEach((_, i) => randomizeWeek(i));
}

function exportPDF() {
  window.print();
}

// ── Boot ─────────────────────────────────────────────────────────────────────

weeks.forEach((_, i) => renderWeek(i, false));
</script>
